
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="calculator">
        <header class="top">
            <div class="brand">
                <span class="brand-icon">✳</span>
                <span>Calculadora</span>
            </div>
            <span class="status">ONLINE</span>
        </header>

        <section class="display">
            <p id="expression">Pronto para calcular</p>
            <output id="result" aria-live="polite">0</output>
        </section>

        <section class="keypad" aria-label="Teclado da calculadora">
            <button class="key function" data-action="clear">AC</button>
            <button class="key function" data-action="sign">±</button>
            <button class="key function" data-action="percent">%</button>
            <button class="key operator" data-operation="dividir">÷</button>

            <button class="key number" data-number="7">7</button>
            <button class="key number" data-number="8">8</button>
            <button class="key number" data-number="9">9</button>
            <button class="key operator" data-operation="multiplicar">×</button>

            <button class="key number" data-number="4">4</button>
            <button class="key number" data-number="5">5</button>
            <button class="key number" data-number="6">6</button>
            <button class="key operator" data-operation="subtrair">−</button>

            <button class="key number" data-number="1">1</button>
            <button class="key number" data-number="2">2</button>
            <button class="key number" data-number="3">3</button>
            <button class="key operator" data-operation="somar">+</button>

            <button class="key function" data-action="backspace">⌫</button>
            <button class="key number zero" data-number="0">0</button>
            <button class="key number" data-action="decimal">,</button>
            <button class="key equals" data-action="equals">=</button>
        </section>

        <footer>Desenvolvido com C# e ASP.NET Core</footer>
    </main>
</body>
</html>
